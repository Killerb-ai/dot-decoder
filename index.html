<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>점은닉 디코더 — 문건 식별코드 분석기</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #5b7cfa;
      --accent2: #7c3aed;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #7c8db5;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      min-height: 100vh;
      font-size: 14px;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex; align-items: center; gap: 14px;
    }
    .header-logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .header-badge {
      margin-left: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
    }

    /* Layout */
    .main { display: flex; height: calc(100vh - 65px); overflow: hidden; }
    .panel-left {
      width: 300px; min-width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .panel-right {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .canvas-area {
      flex: 1;
      min-height: 150px;
      position: relative;
      overflow: auto;
      background: #080b14;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 48px 16px 16px;
    }
    .zoom-toolbar {
      position: absolute;
      top: 10px;
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(26,29,39,0.92);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .zoom-toolbar .btn {
      width: auto;
      padding: 5px 9px;
      font-size: 12px;
    }
    .zoom-label {
      min-width: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .result-bar {
      height: 90px;
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 20px;
    }

    /* Subzone grid panel */
    .subzone-panel {
      flex-shrink: 0;
      border-top: 2px solid var(--accent);
      background: var(--surface2);
      overflow: auto;
      max-height: 340px;
    }
    .subzone-panel-header {
      position: sticky;
      top: 0;
      background: var(--surface2);
      z-index: 10;
      padding: 8px 16px 4px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .subzone-panel-title {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--accent); font-weight: 700;
    }
    .subzone-panel-hint {
      font-size: 10px; color: var(--muted);
    }
    #subzoneGrid {
      padding: 8px 16px 12px;
      overflow-x: auto;
    }
    .subzone-inspector {
      display: none;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 16px 14px;
      border-top: 1px solid var(--border);
      background: rgba(8,11,20,0.45);
    }
    .subzone-inspector.show { display: flex; }
    .subzone-inspector-canvas {
      width: 360px;
      height: 240px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      image-rendering: pixelated;
      flex-shrink: 0;
    }
    .subzone-inspector-meta {
      display: grid;
      gap: 6px;
      min-width: 160px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .subzone-inspector-meta strong { color: var(--text); }
    .subzone-row {
      display: flex;
      gap: 3px;
      align-items: center;
      margin-bottom: 3px;
    }
    .subzone-row-label {
      width: 34px;
      font-size: 10px;
      color: var(--accent);
      font-weight: 700;
      text-align: right;
      padding-right: 5px;
      flex-shrink: 0;
    }
    .subzone-cell {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s;
      flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .subzone-cell:hover { transform: scale(1.08); z-index: 5; }
    .subzone-cell.detected {
      border-color: var(--green);
      box-shadow: 0 0 8px rgba(34,197,94,0.6);
    }
    .subzone-cell.high-score { border-color: var(--yellow); }
    .subzone-score-label {
      position: absolute; bottom: 1px; right: 2px;
      font-size: 8px; font-weight: 700;
      background: rgba(0,0,0,0.7);
      padding: 1px 3px; border-radius: 2px;
    }
    .subzone-si-label {
      position: absolute; top: 1px; left: 2px;
      font-size: 8px;
      color: rgba(255,255,255,0.55);
    }
    .subzone-header-row {
      display: flex;
      gap: 3px;
      margin-bottom: 2px;
      padding-left: 38px;
    }
    .subzone-col-label {
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      flex-shrink: 0;
    }

    /* Cards / sections in left panel */
    .section { display: flex; flex-direction: column; gap: 8px; }
    .section-title {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted); font-weight: 600;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: var(--surface2);
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(91,124,250,.07);
    }
    .upload-icon { font-size: 28px; margin-bottom: 8px; }
    .upload-text { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .upload-text strong { color: var(--text); }
    #fileInput { display: none; }

    /* Param groups */
    .param-group { display: flex; flex-direction: column; gap: 6px; }
    .param-row { display: flex; align-items: center; gap: 8px; }
    .param-label { font-size: 12px; color: var(--muted); flex: 1; }
    .param-value {
      font-size: 12px; color: var(--accent);
      font-weight: 600; min-width: 24px; text-align: right;
    }
    input[type=range] {
      flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px;
    }
    select, input[type=number], input[type=text] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
      width: 100%;
    }
    select:focus, input:focus { border-color: var(--accent); }

    /* Buttons */
    .btn {
      padding: 9px 16px; border-radius: 7px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all .15s; width: 100%;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #4a6ef5; }
    .btn-primary:active { transform: scale(.97); }
    .btn-secondary {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; }

    /* Result display */
    .code-display { display: flex; gap: 4px; align-items: center; }
    .digit-box {
      width: 44px; height: 60px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      transition: all .3s;
    }
    .digit-box.detected {
      border-color: var(--accent);
      background: rgba(91,124,250,.12);
    }
    .digit-box .d-num {
      font-size: 22px; font-weight: 700; color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .digit-box .d-idx { font-size: 9px; color: var(--muted); }
    .result-label { font-size: 12px; color: var(--muted); }
    .result-full {
      font-size: 24px; font-weight: 700;
      color: var(--green);
      font-family: monospace;
      letter-spacing: .1em;
    }
    .result-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }

    /* Info box */
    .info-box {
      background: var(--surface2); border-radius: 8px;
      padding: 10px; border: 1px solid var(--border);
      font-size: 11px; color: var(--muted); line-height: 1.6;
    }

    /* Canvas overlays */
    #mainCanvas {
      display: block;
      image-rendering: pixelated;
    }
    .canvas-wrap { position: relative; display: inline-block; }
    #overlayCanvas {
      position: absolute; top: 0; left: 0;
      pointer-events: none;
    }

    /* Toggle */
    .toggle-row {
      display: flex; align-items: center; gap: 8px; justify-content: space-between;
    }
    .toggle {
      width: 36px; height: 20px; background: var(--border);
      border-radius: 10px; cursor: pointer; position: relative;
      transition: background .2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: ''; position: absolute;
      width: 14px; height: 14px; background: #fff;
      border-radius: 50%; top: 3px; left: 3px;
      transition: left .2s;
    }
    .toggle.on::after { left: 19px; }

    #decoderTab { display: flex; }

    /* Density heatmap indicator */
    .density-grid { display: grid; gap: 2px; }
    .density-cell {
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: rgba(255,255,255,.7);
      font-weight: 600;
    }

    /* 수동 마킹 커서 */
    .manual-mode #overlayCanvas { cursor: crosshair !important; pointer-events: auto !important; }
    .mark-badge {
      position: absolute; background: var(--red); color: #fff;
      font-size: 10px; font-weight: 700; border-radius: 50%;
      width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
      transform: translate(-50%, -50%); pointer-events: none;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
    }
    .manual-banner {
      background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4);
      color: #fca5a5; padding: 7px 12px; font-size: 12px; border-radius: 7px;
      display: none;
    }
    .manual-banner.show { display: block; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Stat badges */
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-val { font-size: 18px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }

    /* Alert */
    .alert {
      padding: 8px 12px; border-radius: 7px; font-size: 12px; line-height: 1.5;
    }
    .alert-info { background: rgba(91,124,250,.1); border: 1px solid rgba(91,124,250,.3); color: #a5b4fc; }
    .alert-warn { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: #fcd34d; }
    .alert-success { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #86efac; }

    .divider { border: none; border-top: 1px solid var(--border); }

    /* Region adjust UI */
    .region-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .region-field label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 2px; }

    /* Progress indicator */
    #analyzeProgress {
      display: none;
      font-size: 11px; color: var(--muted);
      padding: 4px 0;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-logo">🔍</div>
  <div>
    <div class="header-title">점은닉 디코더</div>
  </div>
  <div class="header-badge">v4.8 · 선결합 희미점 보강 · 최종 업데이트 2026-06-01 14:39 (KST)</div>
</div>

<!-- ======================== DECODER TAB ======================== -->
<div id="decoderTab" class="main">
  <!-- Left panel -->
  <div class="panel-left">

    <div class="section">
      <div class="section-title">이미지 업로드</div>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📄</div>
        <div class="upload-text">
          <strong>문서 이미지 업로드</strong><br>
          PNG, JPG, BMP
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <hr class="divider">

    <div class="section">
      <div class="section-title">분석 영역 설정</div>
      <div class="toggle-row">
        <span style="font-size:12px; color:var(--muted)">자동 영역 감지</span>
        <div class="toggle on" id="autoDetectToggle"></div>
      </div>

      <div id="manualRegion" style="display:none">
        <div class="region-fields">
          <div class="region-field">
            <label>X (px)</label>
            <input type="number" id="regX" value="50" min="0">
          </div>
          <div class="region-field">
            <label>Y (px)</label>
            <input type="number" id="regY" value="50" min="0">
          </div>
          <div class="region-field">
            <label>너비 (px)</label>
            <input type="number" id="regW" value="400" min="10">
          </div>
          <div class="region-field">
            <label>높이 (px)</label>
            <input type="number" id="regH" value="500" min="10">
          </div>
        </div>
      </div>
    </div>

    <input type="hidden" id="primaryRows" value="4">
    <input type="hidden" id="primaryCols" value="2">
    <input type="hidden" id="subRows" value="2">
    <input type="hidden" id="subCols" value="4">
    <input type="hidden" id="darkThreshSlider" value="100">
    <input type="hidden" id="bgPctSlider" value="88">
    <input type="hidden" id="brightThreshSlider" value="220">
    <input type="hidden" id="minCircSlider" value="20">

    <hr class="divider">

    <div class="section">
      <div class="section-title">오버레이</div>
      <div class="toggle-row">
        <span style="font-size:12px; color:var(--muted)">기본분할 그리드</span>
        <div class="toggle on" id="showPrimaryToggle"></div>
      </div>
      <div class="toggle-row">
        <span style="font-size:12px; color:var(--muted)">세부분할 그리드</span>
        <div class="toggle on" id="showSubToggle"></div>
      </div>
      <div class="toggle-row">
        <span style="font-size:12px; color:var(--muted)">감지 점 표시</span>
        <div class="toggle on" id="showDotsToggle"></div>
      </div>
      <div class="toggle-row">
        <span style="font-size:12px; color:var(--muted)">점수 히트맵</span>
        <div class="toggle" id="showHeatToggle"></div>
      </div>
      <div class="toggle-row">
        <span style="font-size:12px; color:var(--muted)">세부분할 확대</span>
        <div class="toggle" id="showSubzonePanelToggle"></div>
      </div>
    </div>

    <hr class="divider">

    <div class="section">
      <div class="section-title">수동 보정</div>
      <div class="toggle-row">
        <span style="font-size:12px; color:var(--muted)">이미지 클릭</span>
        <div class="toggle" id="manualMarkToggle"></div>
      </div>
      <div class="manual-banner" id="manualBanner">
        이미지에서 점 위치를 클릭하세요
      </div>
      <button class="btn btn-secondary btn-sm" id="clearMarksBtn" style="margin-top:4px">보정 초기화</button>
    </div>

    <hr class="divider">

    <div id="analyzeProgress">분석 중...</div>
    <button class="btn btn-primary" id="analyzeBtn">분석 시작</button>
    <button class="btn btn-secondary" id="resetBtn">↺ 초기화</button>
  </div>

  <!-- Right panel -->
  <div class="panel-right">
    <div class="canvas-area" id="canvasArea">
      <div class="zoom-toolbar">
        <button class="btn btn-secondary btn-sm" id="zoomOutBtn" type="button">−</button>
        <button class="btn btn-secondary btn-sm" id="zoomResetBtn" type="button">100%</button>
        <button class="btn btn-secondary btn-sm" id="zoomInBtn" type="button">+</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
      </div>
      <div id="emptyState" style="text-align:center; color:var(--muted)">
        <div style="font-size:16px">이미지를 업로드하세요</div>
      </div>
      <div class="canvas-wrap" id="canvasWrap" style="display:none">
        <canvas id="mainCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
      </div>
    </div>

    <!-- Result bar -->
    <div class="result-bar">
      <div class="stat">
        <div class="stat-val" id="statZones">—</div>
        <div class="stat-label">감지 영역</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statConf">—</div>
        <div class="stat-label">신뢰도</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statAlgo">—</div>
        <div class="stat-label">알고리즘</div>
      </div>

      <div style="flex:1"></div>

      <div style="text-align:right">
        <div class="result-label">분석된 문건 식별코드</div>
        <div class="result-full" id="resultCode">————————</div>
        <div class="result-actions">
          <button class="btn btn-secondary btn-sm" id="copyCodeBtn" type="button" disabled>복사</button>
        </div>
      </div>

      <div class="code-display" id="codeDisplay">
        <!-- digit boxes injected by JS -->
      </div>
    </div>

    <!-- ── 세부분할영역 확대 그리드 ── -->
    <div class="subzone-panel" id="subzonePanel" style="display:none">
      <div class="subzone-panel-header">
        <span class="subzone-panel-title">세부분할 확대</span>
        <span style="margin-left:auto; font-size:10px; color:var(--muted)">
          <span style="color:var(--green)">■</span> 감지됨
          <span style="color:var(--yellow); margin-left:6px">■</span> 차점수
        </span>
      </div>
      <div id="subzoneGrid"></div>
      <div class="subzone-inspector" id="subzoneInspector">
        <canvas class="subzone-inspector-canvas" id="subzoneInspectorCanvas" width="360" height="240"></canvas>
        <div class="subzone-inspector-meta" id="subzoneInspectorMeta"></div>
      </div>
    </div>
  </div>
</div>


<script>
// ============================================================
//  CORE ALGORITHM v4.8 — 보강 희소 중심점 검출 (Sparse Center Dot)
//  특허 KR 10-1989170 기반
//  고정 그리드: P_ROWS=4, P_COLS=2, S_ROWS=2, S_COLS=4
// ============================================================

// ── 고정 그리드 상수 ──────────────────────────────
const P_ROWS = 4, P_COLS = 2;
const S_ROWS = 2, S_COLS = 4;

// ── 상태 ─────────────────────────────────────────
let state = {
  image: null,
  imageData: null,
  region: null,
  digits: null,
  scores: null,       // [pCount][subCount] 서브존 점수
  candidates: null,   // 전체 점 후보 배열
  zoneBest: null,     // 기본분할별 최우수 후보
  autoDetect: true,
  showPrimary: true,
  showSub: true,
  showDots: true,
  showHeat: false,
  showSubzonePanel: false,
  manualMode: false,
  manualMarks: [],
  selectedSubzone: null,
  zoom: 1,
};

const mainCanvas = document.getElementById('mainCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');
const ctx = mainCanvas.getContext('2d');
const octx = overlayCanvas.getContext('2d');

// ============================================================
//  알고리즘: 희소 중심점 검출
// ============================================================

// ── 회색조 Float32Array 변환 ──────────────────────
function toGrayFloat(imageData) {
  const data = imageData.data;
  const n = imageData.width * imageData.height;
  const gray = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    gray[i] = 0.299 * data[i*4] + 0.587 * data[i*4+1] + 0.114 * data[i*4+2];
  }
  return gray;
}

// ── 백분위 계산 헬퍼 ────────────────────────────
function percentile(arr, pct) {
  if (arr.length === 0) return 255;
  const sorted = Float32Array.from(arr).sort();
  const idx = Math.floor(sorted.length * pct / 100);
  return sorted[Math.min(idx, sorted.length - 1)];
}

// ── 검정/진회색 점 후보 탐지 ─────────────────────
// 로컬배경 이상도는 너무 어두운 픽셀을 텍스트로 제외하므로,
// 작은 원형 연결성분은 별도 후보로 보강한다.
// ── 표선(긴 수평/수직 런) 마스크: 표 격자선 오검출 억제 (v4.8) ──
let _lineMaskCache = null, _lmW = 0, _lmH = 0;
function buildLineMask(gray, w, h, darkThr, L) {
  const dark = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) dark[i] = gray[i] < darkThr ? 1 : 0;
  const line = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) { let run = 0, xs = 0; for (let x = 0; x <= w; x++) { const d = x < w && dark[y*w+x]; if (d) { if (run===0) xs=x; run++; } else { if (run>=L) for (let k=xs;k<x;k++) line[y*w+k]=1; run=0; } } }
  for (let x = 0; x < w; x++) { let run = 0, ys = 0; for (let y = 0; y <= h; y++) { const d = y < h && dark[y*w+x]; if (d) { if (run===0) ys=y; run++; } else { if (run>=L) for (let k=ys;k<y;k++) line[k*w+x]=1; run=0; } } }
  return line;
}
function onLine(x, y) {
  if (!_lineMaskCache) return false;
  const xi = Math.round(x), yi = Math.round(y);
  if (xi < 0 || yi < 0 || xi >= _lmW || yi >= _lmH) return false;
  return _lineMaskCache[yi*_lmW + xi] === 1;
}

function findCompactDarkCandidates(gray, w, h, maxGray, minArea = 1, maxArea = 120) {
  const visited = new Uint8Array(w * h);
  const candidates = [];

  for (let sy = 0; sy < h; sy++) {
    for (let sx = 0; sx < w; sx++) {
      const startIdx = sy * w + sx;
      if (visited[startIdx] || gray[startIdx] > maxGray) continue;

      const queue = [startIdx];
      visited[startIdx] = 1;
      let qHead = 0;
      let sumX = 0, sumY = 0, sumGray = 0;
      let minX = sx, maxX = sx, minY = sy, maxY = sy;

      while (qHead < queue.length) {
        const idx = queue[qHead++];
        const y = Math.floor(idx / w);
        const x = idx % w;
        sumX += x;
        sumY += y;
        sumGray += gray[idx];
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;

        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
            const nIdx = ny * w + nx;
            if (!visited[nIdx] && gray[nIdx] <= maxGray) {
              visited[nIdx] = 1;
              queue.push(nIdx);
            }
          }
        }
      }

      const area = queue.length;
      if (area < minArea || area > maxArea) continue;

      const bboxW = maxX - minX + 1;
      const bboxH = maxY - minY + 1;
      const aspect = Math.max(bboxW, bboxH) / Math.max(1, Math.min(bboxW, bboxH));
      const fill = area / Math.max(1, bboxW * bboxH);
      const radius = Math.max(bboxW, bboxH) / 2;
      const roundness = radius > 0 ? Math.min(1, area / (Math.PI * radius * radius)) : 0;

      if (aspect > 2.6 || fill < 0.18 || roundness < 0.18) continue;

      candidates.push({
        cx: sumX / area,
        cy: sumY / area,
        area,
        meanGray: sumGray / area,
        circularity: roundness,
        score: area * roundness,
        bbox: [minX, minY, maxX, maxY]
      });
    }
  }

  return candidates;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function sampleLocalStats(gray, w, h, cx, cy, radius = 16, darkGray = 170) {
  let total = 0;
  let dark = 0;
  let sum = 0;
  const x0 = Math.max(0, Math.floor(cx - radius));
  const x1 = Math.min(w - 1, Math.ceil(cx + radius));
  const y0 = Math.max(0, Math.floor(cy - radius));
  const y1 = Math.min(h - 1, Math.ceil(cy + radius));

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (Math.hypot(x - cx, y - cy) > radius) continue;
      const v = gray[y * w + x];
      total++;
      sum += v;
      if (v < darkGray) dark++;
    }
  }

  return {
    mean: total ? sum / total : 255,
    darkRatio: total ? dark / total : 0,
  };
}

function estimateZoneBackground(gray, w, zx0, zy0, zx1, zy1, bgPct) {
  const vals = [];
  for (let y = zy0; y < zy1; y += 2) {
    for (let x = zx0; x < zx1; x += 2) {
      vals.push(gray[y * w + x]);
    }
  }
  return percentile(vals, bgPct);
}

function analyzeSparsePass(imageData, region, darkThresh, bgPct, options) {
  const w = imageData.width, h = imageData.height;
  const { x: rx, y: ry, w: rw, h: rh } = region;
  const gray = toGrayFloat(imageData);
  const candidateMaxGray = Math.max(options.maxGray, darkThresh + 40);
  const darkDotCandidates = findCompactDarkCandidates(gray, w, h, candidateMaxGray, 1, options.maxArea);

  const pW = rw / P_COLS, pH = rh / P_ROWS;
  const sW = pW / S_COLS, sH = pH / S_ROWS;

  const allScores = [];
  const digits = [];
  const zoneBest = {};

  for (let pr = 0; pr < P_ROWS; pr++) {
    for (let pc = 0; pc < P_COLS; pc++) {
      const pi = pr * P_COLS + pc;

      // 기본분할 영역 좌표
      const zx0 = Math.max(0, Math.floor(rx + pc * pW));
      const zx1 = Math.min(w, Math.ceil(rx + (pc + 1) * pW));
      const zy0 = Math.max(0, Math.floor(ry + pr * pH));
      const zy1 = Math.min(h, Math.ceil(ry + (pr + 1) * pH));

      const localBg = estimateZoneBackground(gray, w, zx0, zy0, zx1, zy1, bgPct);

      // 서브존별 이상도 합산
      const scores = new Array(S_ROWS * S_COLS).fill(0);
      const subBest = new Array(S_ROWS * S_COLS).fill(null);
      let maxScore = -1, maxSi = 0;
      let bestX = zx0 + (zx1 - zx0) / 2;
      let bestY = zy0 + (zy1 - zy0) / 2;

      for (let sr = 0; sr < S_ROWS; sr++) {
        for (let sc = 0; sc < S_COLS; sc++) {
          const si = sr * S_COLS + sc;
          const sx0 = Math.max(zx0, Math.floor(zx0 + sc * sW));
          const sx1 = Math.min(zx1, Math.ceil(zx0 + (sc + 1) * sW));
          const sy0 = Math.max(zy0, Math.floor(zy0 + sr * sH));
          const sy1 = Math.min(zy1, Math.ceil(zy0 + (sr + 1) * sH));
          const centerX = (sx0 + sx1) / 2;
          const centerY = (sy0 + sy1) / 2;
          const centerRadius = Math.max(9, Math.min(sx1 - sx0, sy1 - sy0) * options.radiusScale);

          let score = 0;

          for (const c of darkDotCandidates) {
            if (c.cx < sx0 || c.cx >= sx1 || c.cy < sy0 || c.cy >= sy1) continue;
            const centerDist = Math.hypot(c.cx - centerX, c.cy - centerY);
            if (centerDist > centerRadius * options.windowScale) continue;

            const local = sampleLocalStats(gray, w, h, c.cx, c.cy, options.localRadius, candidateMaxGray);
            const centerWeight = Math.exp(-Math.pow(centerDist / (centerRadius * options.centerSigma), 2));
            const darkness = Math.pow(
              clamp((localBg - c.meanGray) / options.darkDivisor, 0, options.darkCap),
              options.darkPower
            );
            const sizeScore = Math.exp(-Math.pow((c.area - options.areaCenter) / options.areaSigma, 2));
            const circularityScore = Math.pow(c.circularity, options.circularityPower);
            const cleanBackground = clamp((local.mean - options.cleanBase) / options.cleanSpan, 0, 1);
            const isolation = 1 / (1 + local.darkRatio * options.isolationScale);
            let dotScore = 1000
              * darkness
              * circularityScore
              * sizeScore
              * centerWeight
              * (options.cleanFloor + (1 - options.cleanFloor) * cleanBackground)
              * (options.isolationFloor + (1 - options.isolationFloor) * isolation);

            if (onLine(c.cx, c.cy)) dotScore *= 0.20;
            if (dotScore > score) score = dotScore;
            if (!subBest[si] || dotScore > subBest[si].score) {
              subBest[si] = {
                cx: c.cx,
                cy: c.cy,
                score: dotScore,
                area: c.area,
                meanGray: c.meanGray,
                darkRatio: local.darkRatio
              };
            }
          }

          scores[si] = score;
          if (score > maxScore) {
            maxScore = score;
            maxSi = si;
            bestX = subBest[si]?.cx ?? (sx0 + sx1) / 2;
            bestY = subBest[si]?.cy ?? (sy0 + sy1) / 2;
          }
        }
      }

      allScores.push(scores);
      digits.push(maxScore > 0 ? maxSi : -1);
      zoneBest[pi] = {
        cx: Math.round(bestX), cy: Math.round(bestY),
        pi, si: maxSi, score: maxScore
      };
    }
  }

  return { digits, scores: allScores, candidates: darkDotCandidates, zoneBest };
}

function getScoreStats(scores) {
  const order = scores.map((score, idx) => ({ score, idx }))
    .sort((a, b) => b.score - a.score);
  const best = order[0] ?? { score: 0, idx: -1 };
  const second = order[1] ?? { score: 0, idx: -1 };
  const ratio = second.score > 0
    ? best.score / second.score
    : (best.score > 0 ? 10 : 0);
  return {
    digit: best.score > 0 ? best.idx : -1,
    best: best.score,
    second: second.score,
    ratio,
  };
}

    let source = 'base';

    const faintIsClearer =

      (
        baseStats.best <= 0 ||
        faintStats.ratio >= baseStats.ratio + 1.2 ||
        (baseStats.ratio < 1.7 && faintStats.ratio >= baseStats.ratio * 1.15) ||
        (baseStats.best < 40 && faintStats.best > baseStats.best * 8)
      );

    if (faintIsClearer) {
      selected = faint;
      selectedStats = faintStats;
      source = 'faint';
      usedFaint++;
    }

    const conventionalDisagree = baseStats.digit !== faintStats.digit;
    const conventionalWeak = selectedStats.ratio < 2 || selectedStats.best < 160;
    const ultraIsClean =
      ultraStats.best >= ULTRA_FAINT_OPTIONS.minOverrideScore &&
      ultraStats.ratio >= ULTRA_FAINT_OPTIONS.minOverrideRatio;
    const ultraIsStrong = ultraStats.best >= ULTRA_FAINT_OPTIONS.strongOverrideScore;

    if (ultraIsClean && (conventionalDisagree || conventionalWeak || ultraIsStrong)) {
      selected = ultra;
      selectedStats = ultraStats;
      source = 'ultra';
      usedUltra++;
    }

    const lineAgreesWithSelected =
      lineStats.digit === selectedStats.digit &&
      lineStats.best >= LINE_BOUND_OPTIONS.reinforceScore;
    const lineAgreesWithFaint =
      lineStats.digit === faintStats.digit &&
      lineStats.best >= LINE_BOUND_OPTIONS.overrideScore;
    const lineCanRecoverWeakZone =
      selectedStats.best < 180 ||
      selectedStats.ratio < 1.8 ||
      baseStats.digit !== faintStats.digit;

    if (source !== 'ultra' && lineAgreesWithFaint && lineCanRecoverWeakZone) {
      selected = faint;
      selectedStats = faintStats;
      source = 'faint+line';
      usedFaint++;
      usedLineBound++;
    } else if (lineAgreesWithSelected) {
      source = `${source}+line`;
      usedLineBound++;
    }

    const mergedScores = [...(selected.scores[pi] || [])];
    if (
      lineStats.digit === selectedStats.digit &&
      lineStats.best >= LINE_BOUND_OPTIONS.reinforceScore &&
      mergedScores[selectedStats.digit] !== undefined
    ) {
      mergedScores[selectedStats.digit] += lineStats.best * 0.9;
    }

    digits.push(selectedStats.digit);
    scores.push(mergedScores);
    zoneBest[pi] = {
      ...(selected.zoneBest[pi] || {}),
      pi,
      si: selectedStats.digit,
      source
    };
    if (
      lineStats.digit === selectedStats.digit &&
      lineStats.best >= LINE_BOUND_OPTIONS.overrideScore &&
      lineBound.zoneBest[pi]
    ) {
      zoneBest[pi] = {
        ...lineBound.zoneBest[pi],
        pi,
        si: selectedStats.digit,
        source
      };
    }

    const agreementCount = [
      baseStats.best >= 80 && baseStats.digit === selectedStats.digit,
      faintStats.best >= 80 && faintStats.digit === selectedStats.digit,
      ultraStats.best >= 200 && ultraStats.digit === selectedStats.digit,
      lineStats.best >= LINE_BOUND_OPTIONS.reinforceScore && lineStats.digit === selectedStats.digit
    ].filter(Boolean).length;
    const mergedStats = getScoreStats(mergedScores);
    const strongSingleEvidence =
      mergedStats.best >= 700 ||
      (mergedStats.best >= 450 && mergedStats.ratio >= 2.2) ||
      (mergedStats.best >= 300 && mergedStats.ratio >= 3.5);
    const answerBackedEvidence =
      agreementCount >= 2 &&
      mergedStats.best >= 250 &&
      (mergedStats.ratio >= 1.4 || lineStats.best >= LINE_BOUND_OPTIONS.overrideScore);
    certainties.push(strongSingleEvidence || answerBackedEvidence ? 1 : calcZoneConfidence(mergedScores));
    sources.push(source);
  }

  return {
    digits,
    scores,
    candidates: [...base.candidates, ...faint.candidates, ...ultra.candidates, ...lineBound.candidates],
    zoneBest,
    sources,
    certainties,
    usedFaint,
    usedUltra,
    usedLineBound
  };
}

// ── 희소 중심점 메인 분석 함수 ──────────────
// 기본/흐린점/초희미 고립점 패스를 영역별로 앙상블한다.
function analyzeAnomaly(imageData, region, darkThresh, bgPct) {
  { const _g = toGrayFloat(imageData); _lmW = imageData.width; _lmH = imageData.height;
    _lineMaskCache = buildLineMask(_g, _lmW, _lmH, 210, Math.max(18, Math.round(Math.min(_lmW, _lmH) * 0.02))); }
  const base = analyzeSparsePass(imageData, region, darkThresh, bgPct, SPARSE_BASE_OPTIONS);
  const faint = analyzeSparsePass(imageData, region, darkThresh, bgPct, SPARSE_FAINT_OPTIONS);
  const ultra = analyzeUltraFaintPass(imageData, region, ULTRA_FAINT_OPTIONS);
  const lineBound = analyzeLineBoundPass(imageData, region, LINE_BOUND_OPTIONS);
  const baseConf = calcConfidence(base.scores, base.digits);
  const faintConf = calcConfidence(faint.scores, faint.digits);
  const ultraConf = calcConfidence(ultra.scores, ultra.digits);
  const lineConf = calcConfidence(lineBound.scores, lineBound.digits);
  const selected = combineAnalysisPasses(base, faint, ultra, lineBound);
  selected.confidence = calcEnsembleConfidence(selected);
  selected.mode = selected.usedLineBound > 0
    ? '희소점+선결합'
    : selected.usedUltra > 0
    ? '희소점+초희미'
    : (selected.usedFaint > 0 ? '희소점 앙상블' : '희소점');
  selected.alternates = {
    base: { digits: base.digits, confidence: baseConf },
    faint: { digits: faint.digits, confidence: faintConf },
    ultra: { digits: ultra.digits, confidence: ultraConf },
    lineBound: { digits: lineBound.digits, confidence: lineConf },
    sources: selected.sources
  };
  return selected;
}

// ── [레거시 호환] BFS는 analyzeAnomaly로 대체됨 ──
function findDotCandidatesShape(gray, w, h, darkThresh, brightThresh, minArea, maxArea, minCirc) {
  // 1. 중간 밝기 픽셀 마스크 생성
  const mask = new Uint8Array(w * h);
  for (let i = 0; i < gray.length; i++) {
    mask[i] = (gray[i] >= darkThresh && gray[i] <= brightThresh) ? 1 : 0;
  }

  // 2. 2배 다운샘플링 (속도 향상)
  const ds = 2;
  const sW = Math.floor(w / ds);
  const sH = Math.floor(h / ds);
  const small = new Uint8Array(sW * sH);
  for (let sy = 0; sy < sH; sy++) {
    for (let sx = 0; sx < sW; sx++) {
      small[sy * sW + sx] = mask[(sy * ds) * w + (sx * ds)];
    }
  }

  // 3. BFS 연결성분 분석
  const visited = new Uint8Array(sW * sH);
  const candidates = [];

  for (let sy = 0; sy < sH; sy++) {
    for (let sx = 0; sx < sW; sx++) {
      if (!small[sy * sW + sx] || visited[sy * sW + sx]) continue;

      // BFS
      const queue = [];
      let qHead = 0;
      queue.push(sy * sW + sx);
      visited[sy * sW + sx] = 1;

      let sumY = 0, sumX = 0;
      let minY = sy, maxY = sy, minX = sx, maxX = sx;

      while (qHead < queue.length) {
        const idx = queue[qHead++];
        const cy = Math.floor(idx / sW);
        const cx = idx % sW;
        sumY += cy; sumX += cx;
        if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
        if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;

        // 8방향 탐색
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dy === 0 && dx === 0) continue;
            const ny = cy + dy, nx = cx + dx;
            if (ny < 0 || ny >= sH || nx < 0 || nx >= sW) continue;
            const nIdx = ny * sW + nx;
            if (small[nIdx] && !visited[nIdx]) {
              visited[nIdx] = 1;
              queue.push(nIdx);
            }
          }
        }
      }

      const compSize = queue.length;
      // 원래 해상도 기준 넓이 추정
      const area = compSize * ds * ds;
      if (area < minArea || area > maxArea) continue;

      // 중심점 (원래 좌표로 변환)
      const cY = Math.round((sumY / compSize) * ds);
      const cX = Math.round((sumX / compSize) * ds);

      // 경계 박스 (원래 좌표)
      const bboxH = (maxY - minY + 1) * ds;
      const bboxW = (maxX - minX + 1) * ds;
      const maxR = Math.max(bboxH, bboxW) / 2;

      // 원형도: area / (π × maxR²)  — 완벽한 원 = 1.0
      const circularity = maxR > 0 ? area / (Math.PI * maxR * maxR) : 0;
      if (circularity < minCirc) continue;

      const score = circularity * area;
      candidates.push({
        cx: cX, cy: cY, area, circularity, score,
        bbox: [minX * ds, minY * ds, maxX * ds, maxY * ds]
      });
    }
  }

  // 점수 내림차순 정렬
  candidates.sort((a, b) => b.score - a.score);
  return candidates;
}

// ── 형태기반 메인 분석 함수 ──────────────────────
function analyzeShape(imageData, region, pRows, pCols, sRows, sCols, darkThresh, brightThresh, minCirc) {
  const w = imageData.width, h = imageData.height;
  const { x: rx, y: ry, w: rw, h: rh } = region;

  const gray = toGrayFloat(imageData);

  // 여러 임계값 조합 시도 (첫 번째 성공 시 중단)
  const threshPairs = [
    [darkThresh, brightThresh],
    [darkThresh - 10, brightThresh + 5],
    [darkThresh - 20, brightThresh + 10],
    [Math.max(80, darkThresh - 30), Math.min(255, brightThresh + 15)],
  ];

  let candidates = [];
  for (const [dt, bt] of threshPairs) {
    candidates = findDotCandidatesShape(gray, w, h, dt, bt, 20, 3000, minCirc);
    // 영역 내 후보가 충분하면 중단
    const inRegion = candidates.filter(c =>
      c.cx >= rx && c.cx <= rx+rw && c.cy >= ry && c.cy <= ry+rh
    );
    if (inRegion.length >= pRows * pCols) break;
  }

  const pW = rw / pCols, pH = rh / pRows;
  const sW = pW / sCols, sH = pH / sRows;

  // 각 기본분할 영역별 서브존 점수 누적
  const zoneSubScores = {};  // pi -> si -> score
  const zoneBest = {};       // pi -> best candidate

  for (const c of candidates) {
    const cx = c.cx, cy = c.cy;
    if (cx < rx || cx > rx + rw || cy < ry || cy > ry + rh) continue;

    const pc = Math.min(pCols - 1, Math.max(0, Math.floor((cx - rx) / pW)));
    const pr = Math.min(pRows - 1, Math.max(0, Math.floor((cy - ry) / pH)));
    const pi = pr * pCols + pc;

    const sc = Math.min(sCols - 1, Math.max(0, Math.floor((cx - rx - pc * pW) / sW)));
    const sr = Math.min(sRows - 1, Math.max(0, Math.floor((cy - ry - pr * pH) / sH)));
    const si = sr * sCols + sc;

    if (!zoneSubScores[pi]) zoneSubScores[pi] = {};
    zoneSubScores[pi][si] = (zoneSubScores[pi][si] || 0) + c.score;

    if (!zoneBest[pi] || c.score > zoneBest[pi].score) {
      zoneBest[pi] = { ...c, pi, si };
    }
  }

  // allScores 및 digits 구성
  const allScores = [];
  const digits = [];

  for (let pr = 0; pr < pRows; pr++) {
    for (let pc = 0; pc < pCols; pc++) {
      const pi = pr * pCols + pc;
      const scores = new Array(sRows * sCols).fill(0);

      if (zoneSubScores[pi]) {
        for (const [si, score] of Object.entries(zoneSubScores[pi])) {
          scores[parseInt(si)] = score;
        }
      }

      allScores.push(scores);

      // 최고 점수 서브존 = 해당 자릿수
      let maxS = -1, maxI = -1;
      scores.forEach((s, i) => { if (s > maxS) { maxS = s; maxI = i; } });
      digits.push(maxS > 0 ? maxI : -1);
    }
  }

  return { digits, scores: allScores, candidates, zoneBest };
}

// ── 신뢰도 계산 ──────────────────────────────────
function calcConfidence(scores, digits) {
  if (!scores || !digits) return 0;
  let totalConf = 0;
  let validCount = 0;
  for (let pi = 0; pi < scores.length; pi++) {
    const s = scores[pi];
    const chosen = digits[pi];
    if (chosen < 0 || !s || s.length === 0) continue;
    const sorted = [...s].sort((a,b) => b-a);
    if (sorted[0] <= 0) continue;
    // 1위/2위 비율만 보면 단일 먼지 후보를 과신할 수 있어 절대 점수와 격차도 함께 본다.
    const ratio = sorted.length > 1 && sorted[1] > 0
      ? sorted[0] / sorted[1]
      : (sorted[0] > 0 ? 10 : 0);
    const ratioConf = clamp((ratio - 1) / 3, 0, 1);
    const absoluteConf = clamp(sorted[0] / 280, 0, 1);
    const marginConf = clamp((sorted[0] - (sorted[1] || 0)) / 220, 0, 1);
    totalConf += 0.35 * ratioConf + 0.4 * absoluteConf + 0.25 * marginConf;
    validCount++;
  }
  if (validCount === 0) return 0;
  return Math.round((totalConf / validCount) * 100);
}

// ── 전체영역 자동 감지 ───────────────────────────
function autoDetectRegion(imageData, margin = 10) {
  const data = imageData.data;
  const w = imageData.width, h = imageData.height;
  let minX = w, maxX = 0, minY = h, maxY = 0;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const gray = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
      if (gray < 240) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  if (maxX <= minX || maxY <= minY) {
    return { x: margin, y: margin, w: w - 2*margin, h: h - 2*margin };
  }

  const pad = margin;
  return {
    x: Math.max(0, minX - pad),
    y: Math.max(0, minY - pad),
    w: Math.min(w - Math.max(0, minX - pad), maxX - minX + 2*pad),
    h: Math.min(h - Math.max(0, minY - pad), maxY - minY + 2*pad)
  };
}

// ── 수동 마킹: 클릭 좌표 → 기본/세부분할 계산 ────
function addManualMark(canvasX, canvasY) {
  if (!state.region) return;

  const pRows = parseInt(document.getElementById('primaryRows').value);
  const pCols = parseInt(document.getElementById('primaryCols').value);
  const sRows = parseInt(document.getElementById('subRows').value);
  const sCols = parseInt(document.getElementById('subCols').value);

  const { x: rx, y: ry, w: rw, h: rh } = state.region;
  const pW = rw / pCols, pH = rh / pRows;
  const sW = pW / sCols, sH = pH / sRows;

  if (canvasX < rx || canvasX > rx+rw || canvasY < ry || canvasY > ry+rh) return;

  const relX = canvasX - rx, relY = canvasY - ry;
  const pc = Math.min(Math.floor(relX / pW), pCols - 1);
  const pr = Math.min(Math.floor(relY / pH), pRows - 1);
  const pi = pr * pCols + pc;

  const subRelX = relX - pc * pW;
  const subRelY = relY - pr * pH;
  const sc = Math.min(Math.floor(subRelX / sW), sCols - 1);
  const sr = Math.min(Math.floor(subRelY / sH), sRows - 1);
  const si = sr * sCols + sc;

  const existing = state.manualMarks.findIndex(m => m.pi === pi);
  const mark = { cx: canvasX, cy: canvasY, pi, si, digit: si };
  if (existing >= 0) state.manualMarks[existing] = mark;
  else state.manualMarks.push(mark);

  if (!state.digits) state.digits = Array(pRows * pCols).fill(-1);
  state.digits[pi] = si;

  updateResultDisplay();
  drawSubzoneGrid();
  drawOverlay();
}

function clearManualMarks() {
  state.manualMarks = [];
  const pRows = parseInt(document.getElementById('primaryRows').value);
  const pCols = parseInt(document.getElementById('primaryCols').value);
  if (state.scores) {
    // 자동 감지 결과 복원 (scores 기반)
    const pCount = pRows * pCols;
    state.digits = state.scores.map(s => {
      let maxI = 0, maxV = -1;
      s.forEach((v,i) => { if (v > maxV) { maxV = v; maxI = i; } });
      return maxI;
    });
  } else {
    state.digits = Array(pRows * pCols).fill(-1);
  }
  updateResultDisplay();
  drawSubzoneGrid();
  drawOverlay();
}

// ── 결과 디스플레이 업데이트 ─────────────────────
function updateResultDisplay() {
  if (!state.digits) return;
  const code = state.digits.map(d => d >= 0 ? d : '?').join('');
  document.getElementById('resultCode').textContent = code;
  const copyBtn = document.getElementById('copyCodeBtn');
  copyBtn.disabled = code.includes('?');
  copyBtn.textContent = '복사';

  const codeDisplay = document.getElementById('codeDisplay');
  codeDisplay.innerHTML = '';
  state.digits.forEach((d, i) => {
    const box = document.createElement('div');
    box.className = 'digit-box' + (d >= 0 ? ' detected' : '');
    box.innerHTML = `<div class="d-num">${d >= 0 ? d : '?'}</div><div class="d-idx">P${i}</div>`;
    codeDisplay.appendChild(box);
  });
}

function calcZoneConfidence(scores) {
  if (!scores || scores.length === 0) return 0;
  const sorted = [...scores].sort((a,b) => b-a);
  if (sorted[0] <= 0) return 0;
  const ratio = sorted.length > 1 && sorted[1] > 0
    ? sorted[0] / sorted[1]
    : (sorted[0] > 0 ? 10 : 0);
  const ratioConf = clamp((ratio - 1) / 3, 0, 1);
  const absoluteConf = clamp(sorted[0] / 280, 0, 1);
  const marginConf = clamp((sorted[0] - (sorted[1] || 0)) / 220, 0, 1);
  return 0.35 * ratioConf + 0.4 * absoluteConf + 0.25 * marginConf;
}

function calcEnsembleConfidence(result) {
  // certainties(포화) 대신 실제 점수 격차 기반 신뢰도(calcConfidence) 사용 (v4.8)
  let conf = calcConfidence(result?.scores, result?.digits);
  // 선택된 점이 표선 위에 있으면 그 비율만큼 신뢰도 강등
  if (result?.zoneBest) {
    let onl = 0, n = 0;
    for (const k in result.zoneBest) {
      const z = result.zoneBest[k];
      if (z && z.si >= 0 && z.score > 0) { n++; if (onLine(z.cx, z.cy)) onl++; }
    }
    if (n > 0) conf = Math.round(conf * (1 - 0.5 * (onl / n)));
  }
  return conf;
}

function applyZoom(nextZoom) {
  state.zoom = Math.min(4, Math.max(0.2, nextZoom));
  const pct = Math.round(state.zoom * 100);
  document.getElementById('zoomLabel').textContent = `${pct}%`;
  if (!mainCanvas.width || !mainCanvas.height) return;
  mainCanvas.style.width = `${Math.round(mainCanvas.width * state.zoom)}px`;
  mainCanvas.style.height = `${Math.round(mainCanvas.height * state.zoom)}px`;
  overlayCanvas.style.width = mainCanvas.style.width;
  overlayCanvas.style.height = mainCanvas.style.height;
}

function zoomBy(factor) {
  applyZoom(state.zoom * factor);
}

// ── 세부분할영역 확대 그리드 그리기 ─────────────
function drawSubzoneGrid() {
  const container = document.getElementById('subzoneGrid');
  const panel = document.getElementById('subzonePanel');
  if (!container) return;

  if (!state.showSubzonePanel || !state.imageData || !state.region || !state.scores) {
    panel.style.display = 'none';
    hideSubzoneInspector();
    return;
  }

  panel.style.display = 'block';

  const pRows = parseInt(document.getElementById('primaryRows').value);
  const pCols = parseInt(document.getElementById('primaryCols').value);
  const sRows = parseInt(document.getElementById('subRows').value);
  const sCols = parseInt(document.getElementById('subCols').value);

  const { x: rx, y: ry, w: rw, h: rh } = state.region;
  const pW = rw / pCols, pH = rh / pRows;
  const sW = pW / sCols, sH = pH / sRows;

  const CELL_W = 58, CELL_H = 40;
  const totalSubs = sRows * sCols;
  const totalPrimary = pRows * pCols;

  container.innerHTML = '';

  // 컬럼 헤더
  const headerRow = document.createElement('div');
  headerRow.className = 'subzone-header-row';
  for (let si = 0; si < totalSubs; si++) {
    const h = document.createElement('div');
    h.className = 'subzone-col-label';
    h.style.width = CELL_W + 'px';
    const sr = Math.floor(si / sCols), sc = si % sCols;
    h.textContent = `S${si}(${sr},${sc})`;
    headerRow.appendChild(h);
  }
  container.appendChild(headerRow);

  // 기본분할 행 (P0~P7)
  for (let pi = 0; pi < totalPrimary; pi++) {
    const pr = Math.floor(pi / pCols);
    const pc = pi % pCols;
    const scores = state.scores[pi] || [];
    const maxScore = Math.max(...scores, 0.0001);

    // 2위 점수 찾기
    const sorted = [...scores].sort((a,b) => b-a);
    const secondScore = sorted.length > 1 ? sorted[1] : 0;

    const row = document.createElement('div');
    row.className = 'subzone-row';

    // 행 레이블
    const rowLabel = document.createElement('div');
    rowLabel.className = 'subzone-row-label';
    rowLabel.textContent = `P${pi}`;
    row.appendChild(rowLabel);

    for (let si = 0; si < totalSubs; si++) {
      const sr = Math.floor(si / sCols);
      const sc = si % sCols;

      const cellX = Math.floor(rx + pc*pW + sc*sW);
      const cellY = Math.floor(ry + pr*pH + sr*sH);
      const cellW = Math.max(1, Math.floor(sW));
      const cellH = Math.max(1, Math.floor(sH));

      const isDetected = state.digits && state.digits[pi] === si;
      const isSecond = !isDetected && scores[si] === secondScore && secondScore > 0;

      const cellDiv = document.createElement('div');
      cellDiv.className = 'subzone-cell' +
        (isDetected ? ' detected' : isSecond ? ' high-score' : '');
      cellDiv.style.width = CELL_W + 'px';
      cellDiv.style.height = CELL_H + 'px';

      // 썸네일 캔버스 — mainCanvas에서 서브존 확대
      const thumb = document.createElement('canvas');
      thumb.width = CELL_W;
      thumb.height = CELL_H;
      const tctx = thumb.getContext('2d');

      // 실제 이미지 픽셀 직접 확대 표시
      tctx.imageSmoothingEnabled = false;
      tctx.drawImage(mainCanvas, cellX, cellY, cellW, cellH, 0, 0, CELL_W, CELL_H);

      // 감지된 서브존이면 중앙에 크로스헤어 표시
      if (isDetected) {
        const cx2 = CELL_W / 2, cy2 = CELL_H / 2;
        tctx.strokeStyle = 'rgba(34,197,94,0.9)';
        tctx.lineWidth = 1.5;
        tctx.beginPath();
        tctx.arc(cx2, cy2, Math.min(CELL_W, CELL_H) * 0.3, 0, Math.PI * 2);
        tctx.stroke();
        tctx.beginPath();
        tctx.moveTo(cx2 - 6, cy2); tctx.lineTo(cx2 + 6, cy2);
        tctx.moveTo(cx2, cy2 - 6); tctx.lineTo(cx2, cy2 + 6);
        tctx.stroke();
      }

      cellDiv.appendChild(thumb);

      // 점수 레이블
      const score = scores[si] || 0;
      const normalizedScore = Math.round((score / maxScore) * 100);
      const scoreLabel = document.createElement('div');
      scoreLabel.className = 'subzone-score-label';
      scoreLabel.style.color = isDetected ? '#22c55e' : isSecond ? '#f59e0b' : 'rgba(255,255,255,0.4)';
      scoreLabel.textContent = `${normalizedScore}%`;
      cellDiv.appendChild(scoreLabel);

      // S번호 레이블
      const siLabel = document.createElement('div');
      siLabel.className = 'subzone-si-label';
      siLabel.textContent = `${si}`;
      cellDiv.appendChild(siLabel);

      // 클릭: 해당 P에서 이 S번호를 수동 지정
      (function(capturedPi, capturedSi) {
        cellDiv.addEventListener('click', () => {
          if (!state.digits) {
            state.digits = Array(totalPrimary).fill(-1);
          }
          state.digits[capturedPi] = capturedSi;

          // 수동 마크에도 추가
          const existing = state.manualMarks.findIndex(m => m.pi === capturedPi);
          const { x: rx2, y: ry2, w: rw2, h: rh2 } = state.region;
          const pW2 = rw2 / pCols, pH2 = rh2 / pRows;
          const sW2 = pW2 / sCols, sH2 = pH2 / sRows;
          const pr2 = Math.floor(capturedPi / pCols), pc2 = capturedPi % pCols;
          const sr2 = Math.floor(capturedSi / sCols), sc2 = capturedSi % sCols;
          const cx = rx2 + pc2*pW2 + sc2*sW2 + sW2/2;
          const cy = ry2 + pr2*pH2 + sr2*sH2 + sH2/2;
          const mark = { cx, cy, pi: capturedPi, si: capturedSi, digit: capturedSi };
          if (existing >= 0) state.manualMarks[existing] = mark;
          else state.manualMarks.push(mark);

          state.selectedSubzone = { pi: capturedPi, si: capturedSi };
          updateResultDisplay();
          drawSubzoneGrid();
          drawOverlay();
        });
      })(pi, si);

      row.appendChild(cellDiv);
    }

    container.appendChild(row);
  }

  if (state.selectedSubzone) {
    showSubzoneInspector(state.selectedSubzone.pi, state.selectedSubzone.si);
  }
}

function hideSubzoneInspector() {
  const inspector = document.getElementById('subzoneInspector');
  if (inspector) inspector.classList.remove('show');
}

function showSubzoneInspector(pi, si) {
  if (!state.imageData || !state.region) return;

  const pRows = parseInt(document.getElementById('primaryRows').value);
  const pCols = parseInt(document.getElementById('primaryCols').value);
  const sRows = parseInt(document.getElementById('subRows').value);
  const sCols = parseInt(document.getElementById('subCols').value);
  const { x: rx, y: ry, w: rw, h: rh } = state.region;
  const pW = rw / pCols, pH = rh / pRows;
  const sW = pW / sCols, sH = pH / sRows;
  const pr = Math.floor(pi / pCols), pc = pi % pCols;
  const sr = Math.floor(si / sCols), sc = si % sCols;
  const cellX = Math.floor(rx + pc*pW + sc*sW);
  const cellY = Math.floor(ry + pr*pH + sr*sH);
  const cellW = Math.max(1, Math.floor(sW));
  const cellH = Math.max(1, Math.floor(sH));

  const inspector = document.getElementById('subzoneInspector');
  const canvas = document.getElementById('subzoneInspectorCanvas');
  const meta = document.getElementById('subzoneInspectorMeta');
  const ictx = canvas.getContext('2d');
  ictx.imageSmoothingEnabled = false;
  ictx.clearRect(0, 0, canvas.width, canvas.height);
  ictx.fillStyle = '#fff';
  ictx.fillRect(0, 0, canvas.width, canvas.height);
  ictx.drawImage(mainCanvas, cellX, cellY, cellW, cellH, 0, 0, canvas.width, canvas.height);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  ictx.strokeStyle = 'rgba(34,197,94,0.95)';
  ictx.lineWidth = 2;
  ictx.beginPath();
  ictx.arc(centerX, centerY, Math.min(canvas.width, canvas.height) * 0.12, 0, Math.PI * 2);
  ictx.stroke();
  ictx.beginPath();
  ictx.moveTo(centerX - 18, centerY); ictx.lineTo(centerX + 18, centerY);
  ictx.moveTo(centerX, centerY - 18); ictx.lineTo(centerX, centerY + 18);
  ictx.stroke();

  const best = state.zoneBest?.[pi];
  if (best && best.si === si) {
    const bx = (best.cx - cellX) / cellW * canvas.width;
    const by = (best.cy - cellY) / cellH * canvas.height;
    ictx.strokeStyle = 'rgba(239,68,68,0.95)';
    ictx.fillStyle = 'rgba(239,68,68,0.18)';
    ictx.lineWidth = 2;
    ictx.beginPath();
    ictx.arc(bx, by, 18, 0, Math.PI * 2);
    ictx.fill();
    ictx.stroke();
    ictx.beginPath();
    ictx.moveTo(bx - 14, by); ictx.lineTo(bx + 14, by);
    ictx.moveTo(bx, by - 14); ictx.lineTo(bx, by + 14);
    ictx.stroke();
  }

  const score = state.scores?.[pi]?.[si] || 0;
  const maxScore = Math.max(...(state.scores?.[pi] || [0]), 0.0001);
  const normalized = Math.round(score / maxScore * 100);
  const isDetected = state.digits?.[pi] === si;
  meta.innerHTML = `
    <strong>P${pi} / S${si} 확대</strong>
    <span>상태: ${isDetected ? '선택됨' : '미선택'}</span>
    <span>점수: ${Math.round(score)} (${normalized}%)</span>
    <span>빨간 표시: 실제 감지 후보 / 초록 표시: 셀 중심</span>
    <span>이미지 좌표: x ${cellX}~${cellX + cellW}, y ${cellY}~${cellY + cellH}</span>
    <span>클릭한 셀은 해당 P 영역의 답으로 지정됩니다.</span>
  `;
  inspector.classList.add('show');
}

// ── 오버레이 그리기 ──────────────────────────────
function drawOverlay() {
  if (!state.image || !state.region) return;

  const scale = mainCanvas.width / state.image.naturalWidth;
  const { x: rx, y: ry, w: rw, h: rh } = state.region;

  const srx = rx * scale, sry = ry * scale;
  const srw = rw * scale, srh = rh * scale;

  const pRows = parseInt(document.getElementById('primaryRows').value);
  const pCols = parseInt(document.getElementById('primaryCols').value);
  const sRows = parseInt(document.getElementById('subRows').value);
  const sCols = parseInt(document.getElementById('subCols').value);

  const pW = srw / pCols, pH = srh / pRows;
  const sW = pW / sCols, sH = pH / sRows;

  octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  // 전체영역 테두리
  octx.strokeStyle = 'rgba(91,124,250,0.7)';
  octx.lineWidth = 1.5;
  octx.setLineDash([6, 3]);
  octx.strokeRect(srx, sry, srw, srh);
  octx.setLineDash([]);

  // 이상도 히트맵
  if (state.showHeat && state.scores) {
    for (let pr = 0; pr < pRows; pr++) {
      for (let pc = 0; pc < pCols; pc++) {
        const pi = pr * pCols + pc;
        const s = state.scores[pi];
        if (!s) continue;
        const maxS = Math.max(...s, 0.0001);

        for (let sr = 0; sr < sRows; sr++) {
          for (let sc = 0; sc < sCols; sc++) {
            const si = sr * sCols + sc;
            const intensity = s[si] / maxS;
            const x = srx + pc*pW + sc*sW;
            const y = sry + pr*pH + sr*sH;
            octx.fillStyle = `rgba(255,80,0,${intensity * 0.45})`;
            octx.fillRect(x, y, sW, sH);
          }
        }
      }
    }
  }

  // 세부분할 그리드
  if (state.showSub) {
    octx.strokeStyle = 'rgba(120,200,255,0.35)';
    octx.lineWidth = 0.5;
    for (let pr = 0; pr < pRows; pr++) {
      for (let pc = 0; pc < pCols; pc++) {
        for (let sr = 1; sr < sRows; sr++) {
          const y = sry + pr*pH + sr*sH;
          octx.beginPath(); octx.moveTo(srx + pc*pW, y); octx.lineTo(srx + (pc+1)*pW, y); octx.stroke();
        }
        for (let sc = 1; sc < sCols; sc++) {
          const x = srx + pc*pW + sc*sW;
          octx.beginPath(); octx.moveTo(x, sry + pr*pH); octx.lineTo(x, sry + (pr+1)*pH); octx.stroke();
        }
      }
    }
  }

  // 기본분할 그리드
  if (state.showPrimary) {
    octx.strokeStyle = 'rgba(245,158,11,0.8)';
    octx.lineWidth = 1;
    for (let i = 0; i <= pCols; i++) {
      const x = srx + i * pW;
      octx.beginPath(); octx.moveTo(x, sry); octx.lineTo(x, sry+srh); octx.stroke();
    }
    for (let i = 0; i <= pRows; i++) {
      const y = sry + i * pH;
      octx.beginPath(); octx.moveTo(srx, y); octx.lineTo(srx+srw, y); octx.stroke();
    }

    // 기본분할 레이블
    octx.fillStyle = 'rgba(245,158,11,0.85)';
    octx.font = `${Math.max(8, Math.min(14, pH/4))}px monospace`;
    for (let pr = 0; pr < pRows; pr++) {
      for (let pc = 0; pc < pCols; pc++) {
        const pi = pr * pCols + pc;
        octx.fillText(`P${pi}`, srx + pc*pW + 3, sry + pr*pH + 13);
      }
    }
  }

  // 모든 후보점 표시 (작은 파란 점)
  if (state.showDots && state.candidates) {
    for (const c of state.candidates.slice(0, 100)) {
      const cx2 = c.cx * scale, cy2 = c.cy * scale;
      if (cx2 < 0 || cx2 > overlayCanvas.width || cy2 < 0 || cy2 > overlayCanvas.height) continue;
      octx.strokeStyle = 'rgba(100,160,255,0.4)';
      octx.lineWidth = 0.8;
      const r2 = Math.max(2, Math.min(8, Math.sqrt(c.area) * scale * 0.4));
      octx.beginPath(); octx.arc(cx2, cy2, r2, 0, Math.PI * 2); octx.stroke();
    }
  }

  // 감지 점 표시 (선택된 점 — 형태기반)
  if (state.showDots && state.digits && state.scores) {
    for (let pr = 0; pr < pRows; pr++) {
      for (let pc = 0; pc < pCols; pc++) {
        const pi = pr * pCols + pc;
        const digit = state.digits[pi];
        if (digit < 0) continue;

        const scores = state.scores[pi] || [];
        const maxScore = Math.max(...scores, 0.0001);
        const scoreRatio = scores[digit] / maxScore;

        const sr = Math.floor(digit / sCols);
        const sc = digit % sCols;
        const autoPoint = state.zoneBest?.[pi];
        const manualPoint = state.manualMarks.find(m => m.pi === pi);
        const sourcePoint = manualPoint || (autoPoint?.si === digit ? autoPoint : null);
        const cx = sourcePoint ? sourcePoint.cx * scale : srx + pc*pW + sc*sW + sW/2;
        const cy = sourcePoint ? sourcePoint.cy * scale : sry + pr*pH + sr*sH + sH/2;
        const r = Math.min(sW, sH) * 0.28;

        // 신뢰도에 따른 색상 (높으면 초록, 낮으면 노랑)
        const color = scoreRatio > 0.7 ? '#22c55e' : scoreRatio > 0.4 ? '#f59e0b' : '#ef4444';

        octx.fillStyle = color.replace(')', ',0.2)').replace('rgb', 'rgba').replace('#22c55e', 'rgba(34,197,94,0.2)').replace('#f59e0b', 'rgba(245,158,11,0.2)').replace('#ef4444', 'rgba(239,68,68,0.2)');
        octx.fillStyle = `rgba(${hexToRgb(color)},0.2)`;
        octx.beginPath(); octx.arc(cx, cy, r*1.8, 0, Math.PI*2); octx.fill();

        octx.strokeStyle = color;
        octx.lineWidth = 1.5;
        octx.beginPath(); octx.arc(cx, cy, r, 0, Math.PI*2); octx.stroke();

        // 숫자 레이블
        octx.fillStyle = '#fff';
        octx.font = `bold ${Math.max(9, Math.min(16, r))}px monospace`;
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillText(String(digit), cx, cy);
        octx.textAlign = 'left';
        octx.textBaseline = 'alphabetic';
      }
    }
  }

  // 수동 마킹 표시
  for (const mark of state.manualMarks) {
    const mx = mark.cx, my = mark.cy;
    octx.strokeStyle = '#f97316';
    octx.lineWidth = 2;
    octx.beginPath(); octx.arc(mx, my, 10, 0, Math.PI*2); octx.stroke();
    octx.fillStyle = '#f97316';
    octx.beginPath(); octx.arc(mx, my, 3, 0, Math.PI*2); octx.fill();
    const labelX = mx + 13, labelY = my - 8;
    octx.fillStyle = 'rgba(0,0,0,0.7)';
    octx.fillRect(labelX - 2, labelY - 11, 46, 15);
    octx.fillStyle = '#f97316';
    octx.font = 'bold 10px monospace';
    octx.fillText(`P${mark.pi}→${mark.digit}`, labelX, labelY);
  }

  // 수동 마킹 모드 안내
  if (state.manualMode) {
    octx.strokeStyle = 'rgba(239,68,68,0.5)';
    octx.lineWidth = 3;
    octx.setLineDash([8, 4]);
    octx.strokeRect(2, 2, overlayCanvas.width - 4, overlayCanvas.height - 4);
    octx.setLineDash([]);
    octx.fillStyle = 'rgba(239,68,68,0.85)';
    octx.font = 'bold 13px sans-serif';
    octx.fillText('✋ 클릭 마킹 모드', 10, 20);
  }
}

// hex → rgb 헬퍼
function hexToRgb(hex) {
  const m = hex.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if (!m) return '255,255,255';
  return `${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}`;
}

// ── 이미지 로드 및 표시 ──────────────────────────
function loadImage(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      state.image = img;
      state.selectedSubzone = null;
      hideSubzoneInspector();

      const cw = img.naturalWidth;
      const ch = img.naturalHeight;

      mainCanvas.width = cw;
      mainCanvas.height = ch;
      overlayCanvas.width = cw;
      overlayCanvas.height = ch;

      ctx.drawImage(img, 0, 0, cw, ch);
      state.imageData = ctx.getImageData(0, 0, cw, ch);
      applyZoom(Math.min(1, Math.max(0.35, 900 / cw)));

      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('canvasWrap').style.display = 'inline-block';

      if (state.autoDetect) {
        state.region = autoDetectRegion(state.imageData);
        updateManualFields();
      } else {
        state.region = getManualRegion();
      }

      drawOverlay();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function getManualRegion() {
  return {
    x: parseInt(document.getElementById('regX').value) || 0,
    y: parseInt(document.getElementById('regY').value) || 0,
    w: parseInt(document.getElementById('regW').value) || 400,
    h: parseInt(document.getElementById('regH').value) || 500,
  };
}

function updateManualFields() {
  if (!state.region) return;
  document.getElementById('regX').value = Math.round(state.region.x);
  document.getElementById('regY').value = Math.round(state.region.y);
  document.getElementById('regW').value = Math.round(state.region.w);
  document.getElementById('regH').value = Math.round(state.region.h);
}

// ── 분석 실행 ────────────────────────────────────
function analyze() {
  if (!state.imageData) return alert('이미지를 먼저 업로드하세요.');

  const darkThresh = parseInt(document.getElementById('darkThreshSlider').value);
  const bgPct      = parseInt(document.getElementById('bgPctSlider').value);

  if (!state.autoDetect) state.region = getManualRegion();
  else if (!state.region) state.region = autoDetectRegion(state.imageData);

  // 진행 표시
  const progressEl = document.getElementById('analyzeProgress');
  progressEl.style.display = 'block';
  document.getElementById('analyzeBtn').disabled = true;

  // 비동기로 실행 (UI 블록 방지)
  setTimeout(() => {
    try {
      const result = analyzeAnomaly(
        state.imageData, state.region,
        darkThresh, bgPct
      );

      state.digits = result.digits;
      state.scores = result.scores;
      state.candidates = result.candidates;
      state.zoneBest = result.zoneBest;
      state.selectedSubzone = null;

      updateResultDisplay();

      const conf = result.confidence ?? calcConfidence(result.scores, result.digits);
      const detected = result.digits.filter(d => d >= 0).length;
      document.getElementById('statZones').textContent = `${detected}/${P_ROWS*P_COLS}`;
      document.getElementById('statConf').textContent = `${conf}%`;
      document.getElementById('statAlgo').textContent = result.mode || '희소점';

      drawOverlay();
      drawSubzoneGrid();
    } finally {
      progressEl.style.display = 'none';
      document.getElementById('analyzeBtn').disabled = false;
    }
  }, 20);
}

// ── 초기화 ──────────────────────────────────────
function resetAll() {
  state.image = null;
  state.imageData = null;
  state.region = null;
  state.digits = null;
  state.scores = null;
  state.candidates = null;
  state.zoneBest = null;
  state.manualMarks = [];
  state.selectedSubzone = null;

  ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
  octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('canvasWrap').style.display = 'none';
  document.getElementById('resultCode').textContent = '————————';
  const copyBtn = document.getElementById('copyCodeBtn');
  copyBtn.disabled = true;
  copyBtn.textContent = '복사';
  document.getElementById('codeDisplay').innerHTML = '';
  document.getElementById('statZones').textContent = '—';
  document.getElementById('statConf').textContent = '—';
  document.getElementById('statAlgo').textContent = '—';
  document.getElementById('fileInput').value = '';
  document.getElementById('subzonePanel').style.display = 'none';
  document.getElementById('subzoneGrid').innerHTML = '';
  hideSubzoneInspector();
  applyZoom(1);
}

async function copyResultCode() {
  const code = document.getElementById('resultCode').textContent.trim();
  if (!/^\d{8}$/.test(code)) return;

  try {
    await navigator.clipboard.writeText(code);
  } catch {
    const temp = document.createElement('textarea');
    temp.value = code;
    temp.setAttribute('readonly', '');
    temp.style.position = 'fixed';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    temp.remove();
  }

  const copyBtn = document.getElementById('copyCodeBtn');
  copyBtn.textContent = '복사됨';
  setTimeout(() => {
    copyBtn.textContent = '복사';
  }, 1200);
}

// 토글
function makeToggle(id, stateKey, callback) {
  const el = document.getElementById(id);
  el.addEventListener('click', () => {
    el.classList.toggle('on');
    if (stateKey) state[stateKey] = el.classList.contains('on');
    if (callback) callback();
  });
}
makeToggle('autoDetectToggle', 'autoDetect', () => {
  document.getElementById('manualRegion').style.display = state.autoDetect ? 'none' : 'block';
  if (state.autoDetect && state.imageData) {
    state.region = autoDetectRegion(state.imageData);
    updateManualFields();
    drawOverlay();
  }
});
makeToggle('showPrimaryToggle', 'showPrimary', drawOverlay);
makeToggle('showSubToggle', 'showSub', drawOverlay);
makeToggle('showDotsToggle', 'showDots', drawOverlay);
makeToggle('showHeatToggle', 'showHeat', drawOverlay);
makeToggle('showSubzonePanelToggle', 'showSubzonePanel', drawSubzoneGrid);

// 수동 마킹 토글
makeToggle('manualMarkToggle', 'manualMode', () => {
  const banner = document.getElementById('manualBanner');
  const wrap = document.getElementById('canvasWrap');
  if (state.manualMode) {
    banner.classList.add('show');
    overlayCanvas.style.pointerEvents = 'auto';
    overlayCanvas.style.cursor = 'crosshair';
    wrap.classList.add('manual-mode');
  } else {
    banner.classList.remove('show');
    overlayCanvas.style.pointerEvents = 'none';
    overlayCanvas.style.cursor = 'default';
    wrap.classList.remove('manual-mode');
  }
  drawOverlay();
});

document.getElementById('clearMarksBtn').addEventListener('click', clearManualMarks);

// 캔버스 클릭 → 수동 마킹
overlayCanvas.addEventListener('click', (e) => {
  if (!state.manualMode || !state.image) return;
  const rect = overlayCanvas.getBoundingClientRect();
  const scaleX = overlayCanvas.width / rect.width;
  const scaleY = overlayCanvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  addManualMark(cx, cy);
});

// 슬라이더 연동
function bindSlider(sliderId, valueId, suffix = '') {
  const slider = document.getElementById(sliderId);
  const val = document.getElementById(valueId);
  if (!slider || !val) return;
  slider.addEventListener('input', () => {
    val.textContent = slider.value + suffix;
  });
}
bindSlider('darkThreshSlider', 'darkThreshVal');
bindSlider('bgPctSlider', 'bgPctVal');

// 수동 영역 필드
['regX','regY','regW','regH'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    if (!state.autoDetect) { state.region = getManualRegion(); drawOverlay(); }
  });
});

</script>
